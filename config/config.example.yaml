# Copy this file to config/config.yaml and edit with your own values.
# config/config.yaml is gitignored since it may contain personal salary info.

salary_expectation:
  min: 120000
  max: 150000
  currency: AUD
  period: annual        # annual | hourly

search:
  date_range_days: 5            # only consider postings within the last N days (LinkedIn maps this to its native f_TPR filter)
  locations:
    - "Sydney NSW"
    - "Remote"
  keywords:                     # one search run per keyword, per enabled portal
    - "Team Lead"
    - "Technical Lead"
    - "Engineering Lead"
    - "Senior Software Engineer"
    - "Senior Software Developer"
    - "Senior Backend Engineer"
    - "Engineering Manager"
    - "Platform Engineer"
  exclude_keywords:              # postings whose title contains these are skipped
    - "Junior"
    - "Intern"
  employment_types:              # full_time | part_time | contract | casual
    - full_time
  min_match_score_for_docs: 8    # matchScore threshold to trigger resume/cover letter generation

portals:
  seek:
    enabled: true
    base_url: "https://au.seek.com"
  jora:
    enabled: true
    base_url: "https://au.jora.com"
  linkedin:
    enabled: true
    base_url: "https://www.linkedin.com"
  indeed:
    enabled: true
    base_url: "https://au.indeed.com"

llm:
  model: "openai/gpt-4o-mini"    # model id (format depends on provider - see below)
  provider: "github_models"      # github_models | openai | anthropic | google_genai | bedrock
  # api_key_env: "OPENAI_API_KEY"  # optional: override which env var holds the API key
  #
  # All API keys/secrets below go in a gitignored .env file at the repo root
  # (copy .env.example to .env and fill in real values) - never in this file.
  #
  # github_models (default): free/included tier, auth via `gh auth token`
  #   (falls back to GITHUB_MODELS_TOKEN env var). Model ids look like
  #   "openai/gpt-4o-mini", "openai/gpt-4o".
  # openai: direct OpenAI API for full model access + no rate-limit sharing.
  #   Requires OPENAI_API_KEY env var (or api_key_env override). Model ids
  #   look like "gpt-4o", "gpt-4.1".
  # anthropic: direct Anthropic API - often strong for long-form writing like
  #   resumes/cover letters. Requires ANTHROPIC_API_KEY env var (or
  #   api_key_env override). Model ids look like "claude-3-5-sonnet-20241022".
  # google_genai: Google's Gemini API - cheapest paid option. Requires
  #   GOOGLE_API_KEY env var (or api_key_env override). Model ids look like
  #   "gemini-2.5-flash-lite", "gemini-2.0-flash".
  # bedrock: AWS Bedrock - no single API key; uses the standard AWS
  #   credential chain (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/
  #   AWS_SESSION_TOKEN env vars, ~/.aws/credentials, or an IAM role) plus
  #   AWS_REGION. Model ids look like "anthropic.claude-3-5-sonnet-20241022-v2:0",
  #   "amazon.nova-micro-v1:0".

output:
  report_formats: [csv, html]
  resume_max_pages: 3
