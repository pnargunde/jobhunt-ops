[project]
name = "jobhunt-ops"
version = "0.1.0"
description = "Automated job search, match-scoring, and tailored resume/cover-letter generation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "playwright>=1.45",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
jobhunt = "jobhunt.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
